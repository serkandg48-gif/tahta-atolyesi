<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<meta name="robots" content="noindex">
<title>Tahta kumandası</title>
<style>
  :root { --lac: #1B2A4A; --sari: #E9A23B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #EEF3FA; color: #1a2233; min-height: 100vh; padding: env(safe-area-inset-top) 16px 24px; }
  header { display: flex; align-items: center; gap: 10px; padding: 16px 0 10px; }
  header b { font-size: 1.2rem; flex: 1; }
  #durum { font-size: .85rem; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: #fde7c3; color: #7a5410; }
  #durum.ok { background: #d8f1df; color: #1f6b3a; }
  .izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button, label.dug { border: 0; border-radius: 22px; background: #fff; padding: 20px 12px; font: inherit; font-weight: 800; font-size: 1.05rem; color: var(--lac); box-shadow: 0 4px 14px rgba(20,30,50,.08); display: grid; justify-items: center; gap: 8px; cursor: pointer; }
  button span, label.dug span { font-size: 2rem; line-height: 1; }
  button:active, label.dug:active { transform: scale(.97); }
  .genis { grid-column: 1 / -1; background: var(--lac); color: #fff; }
  .genis.sari { background: var(--sari); }
  #foto { display: none; }
  #bilgi { margin: 18px 0 0; font-size: .9rem; color: #556; line-height: 1.5; }
  #onizleme { display: none; margin-top: 14px; width: 100%; border-radius: 16px; }
  .kapali .izgara { opacity: .4; pointer-events: none; }
</style>
</head>
<body class="kapali">
<header><b>Tahta kumandası</b><span id="durum">Bağlanıyor</span></header>
<div class="izgara">
  <label class="dug genis sari" for="foto"><span>📷</span>Defteri tahtaya yansıt</label>
  <input id="foto" type="file" accept="image/*" capture="environment">
  <button data-k="isim"><span>🎯</span>İsim çek</button>
  <button data-k="zaman"><span>⏱️</span>Zamanlayıcı</button>
  <button data-k="perde"><span>🌙</span>Ekran perdesi</button>
  <button data-k="sus"><span>🤫</span>Şşşt</button>
  <button data-k="geri"><span>◀️</span>Geri</button>
  <button data-k="ileri"><span>▶️</span>İleri</button>
  <button data-k="fotokapat" class="genis"><span>✖️</span>Yansıtmayı kapat</button>
</div>
<img id="onizleme" alt="Gönderilen fotoğraf">
<p id="bilgi">Telefonun tahtaya bağlı. Fotoğraflar tahtada gösterilir, hiçbir yerde saklanmaz. Tahtadaki pencere kapanınca bağlantı biter.</p>
<script>
(function () {
  var oda = (location.hash || "").slice(1), ws = null, deneme = 0;
  var durum = document.getElementById("durum");
  function yaz(t, ok) { durum.textContent = t; durum.className = ok ? "ok" : ""; document.body.classList.toggle("kapali", !ok); }
  if (!/^[A-Za-z0-9_-]{22}$/.test(oda)) { yaz("Bağlantı geçersiz"); return; }
  function baglan() {
    var p = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(p + "//" + location.host + "/api/kumanda?oda=" + oda + "&rol=telefon");
    ws.onopen = function () { deneme = 0; yaz("Bağlı", true); };
    ws.onclose = function (e) { if (e.code === 4001 || e.code === 4002) return yaz("Tahta kapandı"); yaz("Yeniden bağlanıyor"); if (deneme++ < 8) setTimeout(baglan, 1500 * deneme); else yaz("Bağlanamadı"); };
  }
  function gonder(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  document.querySelectorAll("button[data-k]").forEach(function (b) { b.addEventListener("click", function () { gonder({ t: "komut", k: b.dataset.k }); if (navigator.vibrate) navigator.vibrate(20); }); });
  /* fotoğrafı küçült: en uzun kenar 1600 piksel, JPEG */
  document.getElementById("foto").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return; yaz("Gönderiliyor", true);
    var img = new Image(); img.onload = function () {
      var m = 1600, o = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * o); c.height = Math.round(img.height * o); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var d = c.toDataURL("image/jpeg", 0.72); if (d.length > 1400000) d = c.toDataURL("image/jpeg", 0.5);
      gonder({ t: "foto", d: d }); var on = document.getElementById("onizleme"); on.src = d; on.style.display = "block"; yaz("Bağlı", true); URL.revokeObjectURL(img.src); e.target.value = "";
    };
    img.src = URL.createObjectURL(f);
  });
  baglan();
})();
</script>
</body>
</html>
