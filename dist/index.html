    const gr = h("select.in", { "aria-label": "Sınıf seviyesi" }, [1, 2, 3, 4, 5, 6, 7, 8].map((g) => h("option", { value: g, selected: g === c.grade }, g + ". sınıf")));
    area.append(h("div.paper", { style: { padding: "20px", display: "grid", gap: "14px", maxWidth: "760px" } },
      h("div.form-grid", h("label.f", h("span", "Sınıf adı"), nm), h("label.f", h("span", "Seviye"), gr)),
      h("label.f", h("span", "Her satıra bir öğrenci. e-Okul'dan kopyalayıp yapıştırabilirsin."), ta),
      h("p.hint", "Öğrenci fotoğrafı tutulmaz; herkese adına göre bir hayvan yüzü verilir. Yalnızca ad yazman yeterli."),
      h("div.row",
        h("button.btn.c-leaf", { onclick: () => {
          const names = ta.value.split(/\n+/).map((x) => x.trim()).filter(Boolean);

        h("button.btn.c-sky", { onclick: () => {
          T.store.update((st) => { const nc = { id: T.uid(), name: "Yeni sınıf", grade: 1, kademe: "ilkokul", students: [] }; st.classes.push(nc); st.activeClassId = nc.id; });
          T.route();
        } }, T.icon("plus"), "Yeni sınıf"),
        h("div.spacer"),
        s.classes.length > 1 ? h("button.btn.c-tomato", { onclick: async () => {
          if (!(await T.confirm("Sınıfı sil", c.name + " ve bütün kayıtları silinsin mi?", "Sil"))) return;
          T.store.update((st) => { st.classes = st.classes.filter((x) => x.id !== c.id); st.activeClassId = st.classes[0].id; });
          T.applyTheme(); T.route();
        } }, T.icon("trash"), "Sınıfı sil") : null)));
  }
})();

(function () {

    },
  };

  const CATS = [
    ["his", "Sayı hissi", "dots"], ["oyun", "Oyunlar", "star"], ["manip", "Manipülatifler", "blocks"], ["sim", "Simülasyonlar", "scale"],
    ["orta", "Ortaokul", "algebra"], ["tuval", "Serbest tuval", "canvas"],
  ];
  let cat = "his";
  T.sections.matematik = {
    title: "Matematik", icon: "math", tone: "sun",
    desc: "Sayı hissi, manipülatifler, simülasyonlar",
    render(view, sub) {
      if (sub && T.tools[sub]) return T.toolPage(view, sub);
      const g = T.store.grade();
      const wrap = h("div.view-inner");
      view.append(wrap);
      wrap.append(h("div.page-head", h("h1", "Matematik atölyesi"), h("div.sub", "Sınıfın: " + g + ". sınıf. Araçlar sınıf seviyesine göre sıralanır; hepsi her sınıfta açılabilir.")),
        h("div.tabs", { role: "tablist" }, CATS.map(([k, l, ic]) => h("button", { role: "tab", "aria-selected": String(cat === k), onclick: () => { cat = k; T.route(); } }, T.icon(ic), l))));
      const list = Object.entries(T.tools).filter(([, t]) => t.cat === cat && (t.back || "matematik") === "matematik")
        .sort((a, b) => fitScore(b[1], g) - fitScore(a[1], g));
      wrap.append(h("div.tool-grid", list.map(([k, t]) => h("button.tool-card.c-" + (t.tone || "sun"), { onclick: () => T.go("matematik-" + k) },
        T.icon(t.icon), h("span", t.title, h("small", t.short || (t.grades ? t.grades[0] + "-" + t.grades[1] + ". sınıf" : "")))))));
    },
  };
  const fitScore = (t, g) => (t.grades && g >= t.grades[0] && g <= t.grades[1] ? 1 : 0);

  const tool = (id, def) => (T.tools[id] = def);
  const S = T.svg;

  /* ---------- Günün sayısı (okulun kaçıncı günü) ---------- */
  tool("gunun-sayisi", {
    title: "Günün sayısı", icon: "calendar", tone: "leaf", cat: "his", grades: [1, 4], short: "Okulun kaçıncı günü, her gün bir sayı",
    render(host) {
      let n = Math.max(1, T.cal.dayNumber());
      const out = h("div");
      host.append(out);
      function blocks(n) {
        const H = Math.floor(n / 100), Tn = Math.floor((n % 100) / 10), O = n % 10;
        const s = S("svg", { viewBox: `0 0 ${Math.max(300, H * 118 + Tn * 18 + Math.ceil(O / 5) * 18 + 40)} 120`, style: "width:100%;max-height:150px" });
        let x = 4;
        for (let i = 0; i < H; i++) { s.append(S("rect", { x, y: 4, width: 110, height: 110, fill: "#8fd0f5", stroke: "#164e7a", "stroke-width": 2 })); for (let k = 1; k < 10; k++) { s.append(S("line", { x1: x + k * 11, y1: 4, x2: x + k * 11, y2: 114, stroke: "#164e7a", "stroke-width": 0.6 })); s.append(S("line", { x1: x, y1: 4 + k * 11, x2: x + 110, y2: 4 + k * 11, stroke: "#164e7a", "stroke-width": 0.6 })); } x += 118; }
        for (let i = 0; i < Tn; i++) { s.append(S("rect", { x, y: 4, width: 11, height: 110, fill: "#8fd0f5", stroke: "#164e7a", "stroke-width": 2 })); for (let k = 1; k < 10; k++) s.append(S("line", { x1: x, y1: 4 + k * 11, x2: x + 11, y2: 4 + k * 11, stroke: "#164e7a", "stroke-width": 0.6 })); x += 18; }
        for (let i = 0; i < O; i++) s.append(S("rect", { x: x + Math.floor(i / 5) * 18, y: 103 - (i % 5) * 16, width: 11, height: 11, fill: "#8fd0f5", stroke: "#164e7a", "stroke-width": 2 }));
        return s;
      }
      function tally(n) {
        const s = h("div.tally");
        const k = Math.min(n, 200);
        for (let i = 0; i < Math.floor(k / 5); i++) { const g = S("svg", { viewBox: "0 0 40 30" }); g.innerHTML = '<path d="M5 3v24M12 3v24M19 3v24M26 3v24M1 24 32 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>'; s.append(g); }
        if (k % 5) { const g = S("svg", { viewBox: "0 0 40 30" }); g.innerHTML = Array.from({ length: k % 5 }, (_, i) => `<path d="M${5 + i * 7} 3v24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>`).join(""); s.append(g); }

          h("section.paper", { style: { padding: "20px", display: "grid", gap: "14px" } }, h("h2", { style: { fontSize: "22px" } }, "Okul takvimi"),
            h("p.hint", { style: { margin: 0 } }, "MEB 2026-2027 çalışma takvimi yüklü. Okulunun takvimi farklıysa düzelt. Okulun kaçıncı günü ve yıllık plan bu takvimle hesaplanır."),
            h("div.form-grid", field("İlk ders günü", cs), field("Son ders günü", ce)),
            field("Okulun kapalı olduğu günler: başlangıç | bitiş | ad", closed),

              T.store.update(() => { cal.start = cs.value; cal.end = ce.value; cal.closed = list.map((x) => [x[0], x[1], x[2] || "Tatil"]); });
              T.toast("Takvim kaydedildi. Bugün okulun " + T.cal.dayNumber() + ". günü.");
            } }, T.icon("save"), "Takvimi kaydet"),

          h("section.paper", { style: { padding: "20px", display: "grid", gap: "14px" } }, h("h2", { style: { fontSize: "22px" } }, "Verilerim"),
            h("p", { style: { margin: 0 } }, "Sınıf listeleri, yoklama ve planlar şimdilik yalnızca bu cihazda, bu tarayıcıda tutulur. Google ile giriş açıldığında bütün cihazlarında eşitlenecek. O zamana kadar ara ara yedek al."),
            h("p.hint", { style: { margin: 0 } }, "Öğrenci fotoğrafı tutulmaz, yapay zekaya öğrenci adı gönderilmez."),
            h("div.row", h("button.btn.c-sky", { onclick: () => T.download("tahta-atolyesi-yedek.json", backup(), "application/json") }, T.icon("download"), "Yedek indir"),
              h("label.btn.c-chalk", { style: { cursor: "pointer" } }, T.icon("save"), "Yedekten yükle", h("input", { type: "file", accept: ".json,application/json", style: { display: "none" }, onchange: async (e) => {
                const f = e.target.files[0]; if (!f) return;
                try { const j = JSON.parse(await f.text()); if (!j.classes) throw 0; T.store.update((st2) => Object.assign(st2, j)); T.applyTheme(); T.toast("Yedek yüklendi"); T.route(); }
                catch (er) { T.toast("Bu dosya bir Tahta Atölyesi yedeği değil"); }

/* ---- shell.js ---- */
/* Kabuk: üst çerçeve, ana sayfa, tebeşirlik, yönlendirme */
(function () {
  const { h } = T;

  T.sections.ekran = {
    title: "Ders ekranı", icon: "board", tone: "sun", desc: "Zamanlayıcı, isim çek, zar, trafik ışığı...",
    full: true,
    render(view) { T.board.render(view); },
  };

  T.applyTheme = function () {
    document.documentElement.setAttribute("data-kademe", T.store.kademe());
  };

  /* ---------- Üst çerçeve ---------- */
  function topbar() {
    const el = T.$("#topbar");
    const c = T.store.activeClass();
    const n = T.cal.dayNumber(), st = T.cal.status(), sp = T.cal.specialDay();
    const mark = T.svg("svg", { viewBox: "0 0 48 48", class: "brand-mark", "aria-hidden": "true" });
    mark.innerHTML = '<rect x="3" y="7" width="42" height="30" rx="4" fill="#1f4b3a" stroke="#fff8ec" stroke-width="3"/><path d="M11 17h12M11 24h20" stroke="#fff8ec" stroke-width="3" stroke-linecap="round"/><path d="M33 41h10" stroke="#fff8ec" stroke-width="4" stroke-linecap="round"/><circle cx="36" cy="16" r="4" fill="#ffc233"/>';
    const clock = h("div.clock.num", { "aria-label": "Saat" });
    el.replaceChildren(
      h("button.brand", { onclick: () => T.go("ana"), "aria-label": "Ana sayfa" }, mark, h("span", "Tahta Atölyesi"), h("small", "prototip")),
      h("div.daychalk", { "aria-live": "polite" },
        st.kind === "okul" ? [h("span", "Okulun"), h("b", n + "."), h("span", "günü")] : h("span", st.text),
        h("span.opt", "· " + T.longDate()), sp ? h("span.opt", "· " + sp) : null),
      h("div.tb-right",
        h("button.chip-btn", { onclick: pickClass, "aria-label": "Sınıf değiştir" }, T.icon("class"), h("span.lbl", c.name)),
        clock));
    const tick = () => { const d = new Date(); clock.textContent = `${T.pad(d.getHours())}:${T.pad(d.getMinutes())}`; };
    tick(); clearInterval(T._clk); T._clk = setInterval(tick, 10000);
  }
  function pickClass() {
    const s = T.store.get(); let m;
    m = T.modal({ title: "Sınıf seç", body: h("div.tool-grid", s.classes.map((c) => h("button.tool-card.c-" + (c.grade >= 5 ? "sky" : "sun"), { onclick: () => { T.store.update((st) => (st.activeClassId = c.id)); T.applyTheme(); m.close(); T.route(); } }, T.icon("class"), h("span", c.name, h("small", c.grade + ". sınıf, " + c.students.length + " öğrenci"))))),
      actions: [{ label: "Sınıfları düzenle", onClick: () => T.go("sinif") }, { label: "Kapat" }] });
  }

  /* ---------- Tebeşirlik ---------- */
  const DOCK = [["ana", "Ana sayfa", "home", "chalk"], ["ekran", "Ders ekranı", "board", "sun"], ["sinif", "Sınıfım", "class", "sky"], "|", ["birinci", "1. sınıf", "letters", "tomato"],
    ["matematik", "Matematik", "math", "sun"], ["turkce", "Türkçe", "turkce", "tomato"], ["fen", "Fen", "fen", "leaf"], ["sosyal", "Hayat / Sosyal", "sosyal", "sky"], ["ingilizce", "İngilizce", "ingilizce", "grape"], ["zeka", "Bağlam soruları", "zeka", "pink"], "|",
    ["plan", "Plan", "plan", "grape"], ["ayarlar", "Ayarlar", "settings", "chalk"]];
  function dock(cur) {
    T.$("#dock").replaceChildren(...DOCK.map((d) => d === "|" ? h("span.dock-sep", { "aria-hidden": "true" }) :
      h("button.dock-item.c-" + d[3], { "aria-current": cur === d[0] ? "page" : null, onclick: () => T.go(d[0]) }, T.icon(d[2]), d[1])));
  }

  /* ---------- Ana sayfa ---------- */
  T.sections.ana = {
    title: "Ana sayfa", icon: "home",
    render(view) {
      const s = T.store.get(), c = T.store.activeClass();
      const n = T.cal.dayNumber(), st = T.cal.status(), nb = T.cal.nextBreak(), tot = T.cal.total();
      const hr = new Date().getHours();
      const sel = hr < 11 ? "Günaydın" : hr < 17 ? "İyi dersler" : "İyi akşamlar";
      const wrap = h("div.view-inner"); view.append(wrap);
      const day = (s.attendance[c.id] || {})[T.isoDate()] || {};
      const taken = Object.keys(day).length > 0;
      const came = c.students.filter((x) => day[x.id] !== "yok").length;
      const nobetci = (s.duties[c.id] || {})["Nöbetçi"];
      const nob = nobetci && c.students.find((x) => x.id === nobetci);
      const tally = h("div.tally", { "aria-hidden": "true" });
      for (let i = 0; i < Math.floor(Math.min(n, 120) / 5); i++) { const g = T.svg("svg", { viewBox: "0 0 40 30" }); g.innerHTML = '<path d="M5 3v24M12 3v24M19 3v24M26 3v24M1 24 32 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>'; tally.append(g); }
      wrap.append(h("div.home-hero",
        h("div.greet",
          h("h1", `${sel}${s.settings.teacher ? ", " + s.settings.teacher : ""}`),
          h("p", `${c.name} sınıfı, ${c.students.length} öğrenci. ${T.longDate()}.`),
          st.kind === "okul"
            ? h("div.daycount", h("div.daycount-big", n), h("div.daycount-txt", "Okulun " + n + ". günü", h("small", `${tot} okul gününün ${tot - n} günü kaldı${nb ? `. ${nb.name} öncesi ${nb.days} okul günü var` : ""}.`)))
            : h("div.daycount", h("div.daycount-txt", st.text, h("small", `Okulun ${n}. gününden sonra.${nb ? " Sıradaki: " + nb.name : ""}`))),
          tally),
        h("div.paper.today-card.taped",
          h("h2", "Bugün"),
          h("div.today-row", T.icon("check", ""), "Yoklama", taken ? h("span.pill.ok", `${came} / ${c.students.length} geldi`) : h("button.btn.sm.c-sky.pill", { onclick: () => T.go("sinif") }, "Yoklama al")),
          taken ? h("div.meter", h("i", { style: { width: (came / Math.max(1, c.students.length)) * 100 + "%" } })) : null,
          nob ? h("div.today-row", T.avatar(nob.name, 40), "Nöbetçi: " + nob.name) : null,
          T.cal.specialDay() ? h("div.today-row", T.icon("star"), T.cal.specialDay()) : null,
          h("div.today-row", T.icon("spark"), "Bugünün sayısı", h("button.btn.sm.c-leaf.pill", { onclick: () => T.go("matematik-gunun-sayisi") }, "Aç")))));
      wrap.querySelectorAll(".today-row > svg").forEach((x) => (x.style.cssText = "width:28px;height:28px;color:var(--ink-soft)"));

      wrap.append(h("div.section-title", h("h2", "Hemen tahtaya")),
        h("div.quick", [["timer", "Zamanlayıcı", "tomato"], ["name", "İsim çek", "grape"], ["dice", "Zar at", "sun"], ["groups", "Grup kur", "leaf"], ["traffic", "Trafik ışığı", "leaf"], ["noise", "Ses ölçer", "sky"]].map(([k, l, t]) =>
          h("button.btn.big.c-" + t, { onclick: () => { T.go("ekran"); setTimeout(() => T.board.add(k), 60); } }, T.icon(T.widgets[k].icon), l))));

      const tiles = [["birinci", "1. sınıf", "Kitabım, sesler, harf yazma, hece oyunları.", "letters", "tomato", 0.9], ["ekran", "Ders ekranı", "Araçları tahtaya diz, sürükle, büyüt.", "board", "sun", -1.2],
        ["sinif", "Sınıfım", "Yoklama, davranış puanı, oturma planı.", "class", "sky", 0.8],
        ["matematik", "Matematik", "Sayı hissi, oyunlar, manipülatifler, simülasyonlar.", "math", "sun", -0.6],
        ["turkce", "Türkçe", "Hece kartları, okuma hızı, yazım.", "turkce", "tomato", 1.1],
        ["fen", "Fen", "Ölçüm tablosu, ay evreleri, devre.", "fen", "leaf", -0.9],
        ["sosyal", "Hayat / Sosyal", "Zaman şeridi, aile ağacı, harita.", "sosyal", "sky", 0.6],
        ["ingilizce", "İngilizce", "Resimli kartlar, dinle ve seç.", "ingilizce", "grape", -1],
        ["zeka", "Bağlam soruları", "Gerçek hayat durumu, akıl yürütme.", "zeka", "pink", 1.3],
        ["plan", "Plan", "Yapay zekayla günlük ve yıllık plan.", "plan", "grape", -0.4]];
      wrap.append(h("div.section-title", h("h2", "Atölyeler")),
        h("div.tiles", tiles.map(([id, t, d, ic, tone, tilt]) => h("button.tile.c-" + tone, { style: { "--tilt": tilt + "deg" }, onclick: () => T.go(id) }, T.icon(ic, "ic"), h("div", h("h3", t), h("p", d))))));
    },
  };

  /* ---------- Yönlendirme ---------- */
  T.route = function () {
    T.cleanups.splice(0).forEach((f) => { try { f(); } catch (e) {} });
    const raw = (location.hash || "#ana").slice(1);
    const i = raw.indexOf("-");
    const id = i < 0 ? raw : raw.slice(0, i), sub = i < 0 ? null : raw.slice(i + 1);
    const sec = T.sections[id] || T.sections.ana;
    T.applyTheme();
    topbar();
    dock(T.sections[id] ? id : "ana");
    const view = T.$("#view");
    view.replaceChildren();
    view.scrollTop = 0;
    view.style.overflow = sec.full ? "hidden" : "auto";
    try { sec.render(view, sub); }
    catch (e) { console.error(e); view.append(h("div.view-inner", h("div.paper", { style: { padding: "20px" } }, h("p", "Bu bölüm açılırken bir sorun oldu: " + e.message), h("button.btn.c-chalk", { onclick: () => T.go("ana") }, "Ana sayfaya dön")))); }
    document.title = (sec.title && id !== "ana" ? sec.title + " · " : "") + "Tahta Atölyesi";
  };

  window.addEventListener("hashchange", T.route);
  document.addEventListener("cap", () => { if (["plan", "ayarlar", "zeka"].includes((location.hash || "#").slice(1).split("-")[0])) T.route(); });
  document.addEventListener("pointerdown", () => T.sound.unlock(), { once: true });
  T.store.load();
  T.route();
  // Gece yarısını geçince takvim yenilensin
  setInterval(() => { const d = T.isoDate(); if (d !== T._day) { T._day = d; if ((location.hash || "#ana") === "#ana") T.route(); else topbar(); } }, 60000);
  T._day = T.isoDate();
})();

</script>
